services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager_dev
    volumes:
      - taskmanager-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: services/auth-service/.env
    environment:
      DATABASE_URL: postgresql://taskmanager:taskmanager_dev@postgres:5432/taskmanager?schema=auth
      AUTH_PORT: 3001
      USER_SERVICE_URL: http://user-service:3002
      TASK_SERVICE_URL: http://task-service:3003
    command: ["sh", "-c", "npm run db:push && npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    env_file: services/user-service/.env
    environment:
      DATABASE_URL: postgresql://taskmanager:taskmanager_dev@postgres:5432/taskmanager?schema=users
      USER_SERVICE_PORT: 3002
      AUTH_SERVICE_URL: http://auth-service:3001
      TASK_SERVICE_URL: http://task-service:3003
    command: ["sh", "-c", "npm run db:push && npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  task-service:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    env_file: services/task-service/.env
    environment:
      DATABASE_URL: postgresql://taskmanager:taskmanager_dev@postgres:5432/taskmanager?schema=tasks
      TASK_SERVICE_PORT: 3003
    command: ["sh", "-c", "npm run db:push && npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file: services/api-gateway/.env
    environment:
      DATABASE_URL: postgresql://taskmanager:taskmanager_dev@postgres:5432/taskmanager?schema=public
      API_GATEWAY_PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      TASK_SERVICE_URL: http://task-service:3003
      AUTH_SERVICE_PORT: 3001
      USER_SERVICE_PORT: 3002
      TASK_SERVICE_PORT: 3003
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm run db:push && npm start"]
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  taskmanager-data:
